<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phase 7.3 — mycobot_280_m5 2×20 GUI demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1216;
      --fg: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--fg);
      font: 15px/1.45 system-ui, sans-serif;
      padding: 1.5rem;
    }
    main { width: min(100%, 1120px); }
    h1 { font-size: 1.15rem; font-weight: 600; margin: 0 0 0.35rem; }
    p { margin: 0 0 1rem; color: var(--muted); }
    .stage {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45);
    }
    .poster {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      border: 0;
      cursor: pointer;
      background: #000;
    }
    .poster img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .play {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
    }
    .play span {
      width: 4.5rem;
      height: 4.5rem;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      border: 2px solid rgba(255, 255, 255, 0.85);
      color: #fff;
      display: grid;
      place-items: center;
      font-size: 1.6rem;
      padding-left: 0.2rem;
    }
    video {
      width: 100%;
      height: 100%;
      display: none;
      background: #000;
    }
    .stage.is-playing .poster { display: none; }
    .stage.is-playing video { display: block; }
    a { color: var(--accent); }
    .meta { margin-top: 0.85rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1>Phase 7.3 — densest 2×20 tip-contact suite (GUI)</h1>
    <p>Click the image to open the in-browser player (H.264 mp4, 2880×1800 @ 30 fps).</p>
    <div class="stage" id="stage">
      <button class="poster" id="poster" type="button" aria-label="Play Phase 7.3 2×20 demo video">
        <img
          src="mycobot_280_m5_2x20_poster.jpg"
          alt="Poster frame from Phase 7.3 mycobot_280_m5 2×20 GUI demo">
        <div class="play" aria-hidden="true"><span>▶</span></div>
      </button>
      <video
        id="player"
        controls
        playsinline
        preload="metadata"
        poster="mycobot_280_m5_2x20_poster.jpg">
        <source src="mycobot_280_m5_2x20.mp4" type="video/mp4">
      </video>
    </div>
    <p class="meta">
      Direct file:
      <a href="mycobot_280_m5_2x20.mp4">mycobot_280_m5_2x20.mp4</a>
      · write-up:
      <a href="../phase7_3_target_placement.md">phase7_3_target_placement.md</a>
    </p>
  </main>
  <script>
    (function () {
      const stage = document.getElementById("stage");
      const poster = document.getElementById("poster");
      const player = document.getElementById("player");
      function start() {
        stage.classList.add("is-playing");
        const playPromise = player.play();
        if (playPromise && typeof playPromise.catch === "function") {
          playPromise.catch(function () { /* autoplay blocked; controls remain */ });
        }
      }
      poster.addEventListener("click", start);
      poster.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          start();
        }
      });
    })();
  </script>
</body>
</html>
